[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-demo"
version = "0.3.0"
description = "Configurable local-first RAG ingestion and retrieval POC"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
files = ["pymupdf>=1.24,<2", "pillow>=10,<13", "pytesseract>=0.3.13,<1",
         "python-docx>=1.1,<2", "beautifulsoup4>=4.12,<5"]
cloud = ["google-api-python-client>=2.140,<3", "google-auth>=2.30,<3"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
